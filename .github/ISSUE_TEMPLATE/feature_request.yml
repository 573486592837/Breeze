name: Feature request
description: 提出新能力或改进建议
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前遇到的限制或痛点，而不是直接给出实现方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 补充上下文
      description: 使用场景、仓库类型、模型与操作系统等。
    validations:
      required: false
