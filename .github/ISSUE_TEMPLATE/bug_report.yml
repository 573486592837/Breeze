name: Bug report
description: 报告可复现的问题
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢试用 Breeze。提交前请先删除 trace、日志和截图中的 API Key、私有代码与个人信息。

  - type: input
    id: version
    attributes:
      label: Breeze 版本
      description: 运行 `breeze --version`，或写明安装的 tag / commit。
      placeholder: v1.6.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - Linux
        - macOS
        - WSL
        - 其他
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python 版本
      placeholder: "3.11.16"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: 模型与服务商
      description: 只写模型名与服务商，不要填写 API Key。
      placeholder: openai/Pro/deepseek-ai/DeepSeek-V3.2 via SiliconFlow
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: 运行命令
      render: bash
      placeholder: breeze ask "解释 src/breeze/agent.py"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 附上错误输出或最小 trace 片段；请先脱敏。
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 仓库规模、是否 git 工作区、权限模式、相关配置等。
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已删除报告中的 API Key、私有代码与个人信息
          required: true
        - label: 我已搜索现有 Issue，确认不是重复问题
          required: true
