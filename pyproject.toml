[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breeze"
dynamic = ["version"]
description = "Token-efficient coding agent"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    # 1.106.0 起 completion(tools=...) 会无条件 import mcp（litellm 只在
    # proxy/mcp extra 里声明它），而 Breeze 每次带 9 个工具 schema 调用，
    # 于是报 "No module named 'mcp'"。上游修好之前先封住上界；1.105.7 实测可用。
    "litellm>=1.40,<1.106",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[project.scripts]
breeze = "breeze.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "breeze.__version__" }

# ─── Ruff：lint + format ───

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".git", ".venv", "__pycache__", "build", "dist", ".ruff_cache", ".pytest_cache"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
]

[tool.ruff.lint.per-file-ignores]
"src/breeze/cli.py" = ["B008"]
"tests/*" = ["ARG001", "ARG002"]
"scripts/*" = ["ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["breeze"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── pytest ───

[tool.pytest.ini_options]
testpaths = ["tests"]
# src 提供 breeze 包；仓库根提供包外的开发模块 breeze_eval
pythonpath = ["src", "."]