# Breeze 长任务评估集 v1
#
# 每个任务在独立的 git worktree 中运行。
# setup 用 patch 注入 bug，eval_command 判定是否修复成功。
#
# 评分：eval_command 退出码 0 为 True，否则为 False。
# 所有任务只用 patch 形式的 setup，不使用 command，保证跨平台一致。

version: 1
repo: breeze

tasks:
  - id: fix01
    type: fix
    question: "运行 pytest tests/test_fs.py 有测试失败。找到并修复代码中的问题。修复后 pytest -q 必须全部通过，不得引入新的失败。不要修改测试文件。"
    success_criteria: "pytest tests/test_fs.py 全部通过"
    setup:
      - patch: fix01.patch
    eval_command: "pytest -q"
    max_steps: 20

  - id: fix02
